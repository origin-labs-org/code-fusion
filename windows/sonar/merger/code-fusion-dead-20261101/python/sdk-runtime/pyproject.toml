[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "cf-runtime-bin"
version = "0.0.0.dev0"
description = "Pinned CodeFusion runtime for the Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Origin AI" }]

[project.urls]
Homepage = "https://github.com/origin-labs-ai/code-fusion"
Documentation = "https://github.com/origin-labs-ai/code-fusion/blob/master/python/sdk-runtime/README.md"
Issues = "https://github.com/origin-labs-ai/code-fusion/issues"
Source = "https://github.com/origin-labs-ai/code-fusion"

# Include the injected executable and default config; exclude the dev-only node
# closure from wheels and sdists.
[tool.hatch.build]
artifacts = ["src/codefusion_runtime/runtime/cf-jsonrpc-agent-*"]
exclude = ["src/codefusion_runtime/runtime/node"]

[tool.hatch.build.targets.wheel]
packages = ["src/codefusion_runtime"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]
