# Pack the cf release sequence: every package under packages/ plus the apps/
# entries, all on one version. The vendored framework and the native packages are
# separate sequences with their own workflows and version lines.
#
# Pack runs without credentials on every pull request and master push, so a
# pull request proves the whole publish set still packs. Publication is a manual
# workflow_dispatch of release-publish.yml from a cf-v* tag.
name: Release (cf)

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pack runs per ref so concurrent pull requests never displace each other.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  CF_TELEMETRY_DISABLED: '1'

jobs:
  pack:
    name: Pack npm tarballs
    runs-on: ubuntu-24.04
    steps:
      # Complete history: the release scripts read tags.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure npm cache path
        id: npm-store
        run: echo "path=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.npm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-npm-

      - name: Install (immutable)
        run: npm ci

      - name: Verify release version
        run: npm run release:verify --family cf

      - name: Build
        run: npm run build:official

      - name: Pack release tarballs
        run: npm run release:pack --family cf --out dist/npm

      # The harness packages declare the vendored framework as a peer, and this
      # verification must not depend on the registry already carrying matching
      # versions — one pull request may bump both families before either
      # publishes — so it installs that family's pack output too. Only dist/npm
      # is published.
      - name: Pack the vendored framework for verification
        run: npm run release:pack --family vendor --out dist/npm-vendor

      # cf-sandbox-local declares the Landlock entry as a runtime dependency, so
      # the verification needs its tarball. Its platform packages stay out: they
      # are optional, and building them needs a musl toolchain per architecture.
      - name: Pack the Landlock entry for verification
        run: |
          npm --prefix native/landlock-run run build:ts
          npm --dir native/landlock-run/packages/entry pack --pack-destination "$PWD/dist/npm-landlock"

      - name: Verify packed install
        run: npm run release:verify-packed-install --family cf --from dist/npm --from dist/npm-vendor --from dist/npm-landlock

      - uses: actions/upload-artifact@v4
        with:
          name: cf-npm-tarballs
          path: dist/npm/*
          if-no-files-found: error
          retention-days: 7
