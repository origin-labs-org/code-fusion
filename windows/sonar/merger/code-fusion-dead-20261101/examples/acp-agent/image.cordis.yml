# Image-scenario overlay: adds the durable attachment store the read_image tool
# commits through. The store resolves its root from $CF_HOME, which the
# snapshot harness scopes per run, so the overlay itself carries no paths. The
# app config is restated to select the shipped vision model because a config
# patch replaces the whole app config.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: acp-agent
        name: '@origin-ai/cf-acp-demo'
        config:
          provider: deepseek-official
          model: deepseek-v4-flash-vision-exp
          persistenceRoot: !!js process.env.CF_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: none
          workspaceContext:
            maxBytes: 65536
          persona: |
            You are a CodeFusion coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: attachment-local
            name: '@origin-ai/cf-attachment-local'
