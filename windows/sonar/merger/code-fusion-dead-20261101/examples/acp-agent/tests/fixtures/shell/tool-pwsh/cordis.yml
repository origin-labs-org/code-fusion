# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@origin-ai/cf-system-prompt'

- id: tools
  name: '@origin-ai/cf-tools'

- id: subprocess
  name: '@origin-ai/cf-subprocess-local'

- id: bash
  name: '@origin-ai/cf-pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@origin-ai/cf-shell-env'

- id: tasks
  name: '@origin-ai/cf-jobs-local'

- id: tool-jobs
  name: '@origin-ai/cf-tool-jobs'

- id: tool-pwsh
  name: '@origin-ai/cf-tool-pwsh'
