<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="color-scheme" content="light" />
    
    <link
      rel="icon"
      type="image/png"
      href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAACAElEQVR4nO2XzWrVQBiG3/m+mfxSXIh076515xUobgVx4Ua8F9eu688VeA9dlW68BzcqCEJ7oMhBJ78zE5k5JxVPiyRyTCr23SSZhLzPfN87EyK0LnGJOvwdic0BOZHx5vvPQWhC88tAQDOY/wJBmFk00+x7dVeiArOK8L8DyKEPdt0qq23bwDkL51wYI6JwrpRCW7eQkYKUCsy8/Qo4ZwOAN4OzkCQgmSGlhDUWKlZomnrUwpJjAOqqRJamqOoafOMWBATYtUiEQ9OaAJemKay1YJbbBXDOhWNrDEjFiI5eIvv+Ccu7T3HKu8giiTzPQ3W01qsqrbd8IS58g8a3wFqDSEnYeAfi3VskxRk+3H6E5y8O8Ob1K5ycnIZWVFWFLuRjZfw781EARIymaSAVw3xbgnd28bHK8fmswIP797B/Zx9FUSLPMkgVhXAOkdC6HJQYn/iyLJCmCbQucPP4AIfvv+Dr3kM8e/IYi8UCSRzDOgchCFEUbxegXwUeIstzlJ2E1UswCTBxmLGx5tx8SPm9Ri1D3walIti2ReoqKKaw3okpBND3PUnSweZeoyrQyxgTQklCoK5rEHMw9HAeaKi516h9oM+CT/v6CnGShLL7FoyZ+R8DiLXBT4h//GNE1wC4bgEu/i5NKHFlWiBm8A6etDkwpbnX5nbW35js9/wH4J+7No0hjrgAAAAASUVORK5CYII="
      sizes="32x32"
    />
    <title>CodeFusion IDE</title>
    <script>
      (() => {
        const STORAGE_KEY = "cf-theme";
        const DEFAULT_THEME = "cf-light";
        const BROWSER_THEME_COLORS = {
          dark: "#161616",
          light: "#f5f5f7",
        };
        const BOOTSTRAP_SNAPSHOT_KEY = "cf:web-remote-control:bootstrap-shell";

        const normalizeResolvedTheme = (theme) => {
          if (theme === "dark") return "dark";
          if (theme === "light") return "light";
          if (theme === "cf-dark") return "dark";
          if (theme === "cf-light") return "light";
          return theme;
        };

        const syncBrowserThemeSurface = (theme) => {
          document.documentElement.setAttribute("data-cf-browser-theme-surface", theme);
          document.documentElement.style.colorScheme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", BROWSER_THEME_COLORS[theme]);
          document.querySelector('meta[name="color-scheme"]')?.setAttribute("content", theme);
        };

        try {
          let bootstrapTheme = null;
          const bootstrapSnapshotRaw = window.sessionStorage.getItem(BOOTSTRAP_SNAPSHOT_KEY);
          if (bootstrapSnapshotRaw) {
            window.sessionStorage.removeItem(BOOTSTRAP_SNAPSHOT_KEY);
            try {
              const snapshot = JSON.parse(bootstrapSnapshotRaw);
              if (snapshot && typeof snapshot === "object") {
                const normalizedTheme = snapshot.theme === "dark" ? "dark" : "light";
                bootstrapTheme = normalizedTheme;
                document.documentElement.style.setProperty(
                  "--cf-bootstrap-bg",
                  typeof snapshot.background === "string"
                    ? snapshot.background
                    : normalizedTheme === "dark"
                      ? "#0f172a"
                      : "#f8fafc",
                );
                document.documentElement.style.setProperty(
                  "--cf-bootstrap-fg",
                  typeof snapshot.foreground === "string"
                    ? snapshot.foreground
                    : normalizedTheme === "dark"
                      ? "#e2e8f0"
                      : "#334155",
                );
                if (typeof snapshot.border === "string") {
                  document.documentElement.style.setProperty(
                    "--cf-bootstrap-border",
                    snapshot.border,
                  );
                }
                if (typeof snapshot.card === "string") {
                  document.documentElement.style.setProperty(
                    "--cf-bootstrap-card",
                    snapshot.card,
                  );
                }
              }
            } catch {
              // ignore invalid snapshot
            }
          }

          const saved = localStorage.getItem(STORAGE_KEY) || DEFAULT_THEME;
          const resolved =
            saved === "system"
              ? window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : normalizeResolvedTheme(saved);
          const fallbackTheme = resolved === "dark" ? "dark" : "light";
          const finalTheme = bootstrapTheme ?? fallbackTheme;
          document.documentElement.setAttribute("data-cf-bootstrap-theme", finalTheme);
          syncBrowserThemeSurface(finalTheme);
          if (finalTheme === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch {
          document.documentElement.setAttribute("data-cf-bootstrap-theme", "dark");
          syncBrowserThemeSurface("dark");
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--cf-bootstrap-bg, var(--color-background, #0f172a));
        color: var(--cf-bootstrap-fg, var(--color-foreground, #e2e8f0));
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      html[data-cf-bootstrap-theme="light"] body {
        background: var(--cf-bootstrap-bg, var(--color-background, #f8fafc));
        color: var(--cf-bootstrap-fg, var(--color-foreground, #334155));
      }

      html[data-cf-browser-theme-surface],
      html[data-cf-browser-theme-surface] body,
      html[data-cf-browser-theme-surface] #root {
        
        background: var(--color-background, var(--cf-bootstrap-bg, #161616)) !important;
      }

      html[data-cf-browser-theme-surface="light"],
      html[data-cf-browser-theme-surface="light"] body,
      html[data-cf-browser-theme-surface="light"] #root {
        background: var(--color-background, var(--cf-bootstrap-bg, #f8f8f8)) !important;
      }

      .cf-boot-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        
        background: var(--cf-bootstrap-bg, var(--color-background, #0f172a));
        color: var(--cf-bootstrap-fg, var(--color-foreground, #e2e8f0));
      }

      html[data-cf-bootstrap-theme="light"] .cf-boot-loading {
        background: var(--cf-bootstrap-bg, var(--color-background, #f8fafc));
        color: var(--cf-bootstrap-fg, var(--color-foreground, #334155));
      }

      .cf-boot-loading__logo-shell {
        position: relative;
        display: flex;
        width: 96px;
        height: 96px;
        align-items: center;
        justify-content: center;
        border-radius: 24px;
        background: linear-gradient(180deg, #000000 0%, #151718 100%);
        box-shadow:
          0 20px 25px -5px rgb(0 0 0 / 0.2),
          0 8px 10px -6px rgb(0 0 0 / 0.2);
      }

      .cf-boot-loading__logo-shell::before {
        position: absolute;
        inset: 0;
        pointer-events: none;
        content: "";
        
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: inherit;
      }

      .cf-boot-loading__logo {
        width: 56px;
        height: auto;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="root">
      
      <div
        class="cf-boot-loading"
        role="status"
        aria-live="polite"
        aria-busy="true"
        aria-label="Loading..."
      >
        <div class="cf-boot-loading__logo-shell">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="118px"
            height="100px"
            fill="none"
            viewBox="0 0 256 218"
            class="cf-boot-loading__logo"
            aria-hidden="true"
          >
            <path
              fill="currentColor"
              d="M134.4 0.130152L116.48 25.6022C113.665 29.5699 109.054 32.0019 104.064 32.0019H6.3999V0C6.3999 0.130149 134.4 0.130152 134.4 0.130152Z"
            >
              <animate
                attributeName="opacity"
                dur="1.5s"
                repeatCount="indefinite"
                values="1;0.3;1"
              />
            </path>
            <path fill="currentColor" d="M256 0.130127L102.401 217.732H0L153.599 0.130127H256Z">
              <animate
                attributeName="opacity"
                begin="0.75s"
                dur="1.5s"
                repeatCount="indefinite"
                values="1;0.3;1"
              />
            </path>
            <path
              fill="currentColor"
              d="M121.601 217.732L139.65 192.134C142.465 188.166 147.076 185.734 152.067 185.734H249.604V217.736H121.601V217.732Z"
            >
              <animate
                attributeName="opacity"
                dur="1.5s"
                repeatCount="indefinite"
                values="1;0.3;1"
              />
            </path>
          </svg>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
