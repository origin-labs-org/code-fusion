schemaVersion: 1
backlogId: model-selection-regression-decisions
title: Model Selection回归矩阵的隐含决策与契About核验清单
status: planning
language: zh-CN
purpose: >-
  kModel Provider、Model Selection、Thinking深度、Registry、Request投影、Session、Queue、Remote恢复and
  下游Model消费者Medium不能安全假设的 edge case 单独列出，供产品Adjudication、Documentation收敛、Implementation核验and后续剪枝使用。
statusValues:
  undefined: "Product behavior is not yet clear enough and requires a decision"
  contract-conflict: "Existing specs, implementations, or cases conflict and require converging on an authoritative definition first"
  resolved-needs-proof: "Design intent or implementation exists, but still requires test/log/request evidence to prove"
  pruned-by-contract: "Pruned by a clear invariant; keeping record to prevent accidental re-addition in the future"
decisionRule: >-
  undefined and contract-conflict 不得直接生成会断言产品行为的 formal E2E；resolved-needs-proof
  进入验证Queue而不Yes再次向UserAsk；pruned-by-contract 只能在引用 invariant 后剪枝。
summary:
  totalEntries: 114
  decisionEntries: 64
  contractConflictEntries: 12
  proofEntries: 38
  note: "decisionEntries only indicates undefined items requiring product/contract decisions, not that only these items need testing."
evidenceConventions:
  - "newer-design: 较新的 Provider refactor interaction/selection design"
  - "state-space: conversation-product-state-space.md"
  - "protocol: conversation-product-protocol.md 或 conversation-protocol-declaration.md"
  - "runtime: 当前 live code 的 resolver、input-intent、ModelFactory 或 handler"
  - "case-catalog: conversation-session-case-catalog.md 中已有 case"
  - "graph: feature-boundary-planner graph; results must not be faked when there is no live codegraph index"
entries:
  - id: DEC-001
    domain: selection
    status: undefined
    question: "When opening the picker for the first time in a blank new conversation, what should be displayed if Recent is invalid and Host preferred is also invalid?"
    options:
      [
        "空状态并阻止发送",
        "Picker displays the reason for unavailability but allows user to enter Provider settings",
        "自动选择任意可用模型",
      ]
    recommendation: "Prioritize empty state with clear fix entry point; silently selecting arbitrary model is prohibited."
    evidence:
      [
        "runtime: modelSelectionRecent only accepts selectable Recent; otherwise falls back to Host preferred",
        "blocking: Initial send cannot form a complete selection",
      ]
    blockingCases: [MSR-DRAFT-001]

  - id: DEC-002
    domain: selection
    status: undefined
    question: "When Recent records a provider/model but the model is later disabled, should draft retain intent, switch to preferred, or clear?"
    options: ["Retain intent and display as unavailable", "切到 Host preferred", "Clear and prompt to reselect"]
    recommendation: "Retain intent by default until the user explicitly reselects; whether sending is allowed must be separately determined by the capability guard."
    evidence:
      [
        "newer-design: selection-state requires existing Sessions not to silently fall back due to unavailability",
        "runtime: Recent is only used as an initial selection value if it is selectable",
      ]
    blockingCases: [MSR-DRAFT-003, MSR-SESSION-007]

  - id: DEC-003
    domain: selection
    status: undefined
    question: "Recent、Host preferred、provider family default 三者同时存在时，优先级是否固定为 Recent > Host preferred > family default？"
    options: ["固定该优先级", "按 surface 使用不同优先级", "只允许显式 Host preferred"]
    recommendation: "Maintain unified priority; any exceptions per surface must be explicitly declared."
    evidence:
      [
        "runtime: workspace-keyed fallback chain for modelSelectionRecent",
        "docs: new-task/manual-switch resolution chain",
      ]
    blockingCases: [MSR-DRAFT-001, MSR-SURFACE-007]

  - id: DEC-004
    domain: selection
    status: undefined
    question: "When the user only switches provider without reselecting a model, should the original modelId be retained as cross-provider intent?"
    options:
      ["provider 改变即清空 modelId 并重新解析", "按同名模型迁移", "Retain original modelId until validation fails"]
    recommendation: "Do not automatically migrate by matching string name; re-resolve model after provider changes."
    evidence:
      [
        "runtime: ModelSelection's providerId/modelId is the complete identity",
        "risk: Two Providers may have models with the same name",
      ]
    blockingCases: [MSR-SELECT-002, MSR-REG-002]

  - id: DEC-005
    domain: selection
    status: resolved-needs-proof
    question: "Can the model selection display value directly use provider/model$variant as an inter-process and persistence value?"
    options:
      [
        "Display encoding only; protocol uses structured ModelSelection",
        "Allow string as a compatibility format",
        "Uniformly use display strings everywhere",
      ]
    recommendation: "Adopt the first option; round-trip proof for slash, colon, dollar, and empty values is required."
    evidence:
      [
        "runtime: packages/shared/src/model-selection.ts",
        "newer-design: sparse intent 与 canonical submission 分离",
      ]
    blockingCases: [MSR-REG-002, MSR-REG-003]

  - id: DEC-006
    domain: selection
    status: undefined
    question: "When a single operation changes provider, model, and thought simultaneously, should validation failure roll back entirely or retain partial draft?"
    options:
      ["Atomically roll back to authoritative draft", "Retain acceptable fields and clear failed fields", "Retain user input and highlight in red"]
    recommendation: "commit uses atomic semantics; whether renderer draft retains uncommitted intent must be defined separately."
    evidence:
      [
        "newer-design: authoritative draft model config 与 CAS",
        "runtime: composer draft 具有 renderer-local reactive intent",
      ]
    blockingCases: [MSR-DRAFT-004, MSR-SESSION-002]

  - id: DEC-007
    domain: selection
    status: undefined
    question: "If model capability changes after picker opens, should send use the open snapshot or the submission-time Registry?"
    options: ["Revalidate Registry upon submission", "Reuse snapshot from when picker opened", "Block and require refresh when inconsistent"]
    recommendation: "Revalidate upon submission; if selected value becomes invalid, retain intent and provide an explainable error."
    evidence:
      ["runtime: target Host Registry is the authority", "risk: remote Registry loading/revision 变化"]
    blockingCases: [MSR-DRAFT-005, MSR-REG-006]

  - id: DEC-008
    domain: selection
    status: undefined
    question: "When selectable, disabled, and deprecated versions of the same modelId coexist, how are picker grouping and default resolution determined?"
    options:
      [
        "Only include selectable in default candidates; historical values locked separately",
        "Display all mixed together and sort by revision",
        "Automatically map deprecated to new model",
      ]
    recommendation: "Separate candidate and historical display; implicit revision migration is prohibited."
    evidence:
      ["registry: model membership and enablement design", "blocking: disabled-current UI 仍有冲突"]
    blockingCases: [MSR-REG-005, MSR-UI-003]

  - id: DEC-009
    domain: selection
    status: undefined
    question: "When a model\'s default thought/variant changes, should empty options in existing sparse selections follow the new default?"
    options:
      [
        "Resolve the latest default for empty options each time ModelFactory creates",
        "Freeze into Session after initial resolution",
        "Write back to Session selection upon updating Registry",
      ]
    recommendation: "Empty options do not persist specific defaults; resolved according to current design at execution, but explicit overrides are never overwritten."
    evidence:
      [
        "newer-design: ModelSelection sparse intent, missing options resolved at ModelFactory creation",
      ]
    blockingCases: [MSR-REASON-006, MSR-SESSION-008]

  - id: DEC-010
    domain: selection
    status: undefined
    question: "When user switches to a different model, should the previous thought override be cleared, migrated, or retained and validated against the new model?"
    options: ["跨 model 清空 thought override", "保留并校验，不兼容时阻止", "Migrate by matching thought name"]
    recommendation: "Clear thought override across models; this is the current composer fact, but needs unification across all surfaces."
    evidence:
      [
        "runtime: useDraftConfigControl cross-model clears thought",
        "risk: Automation/Off-Peak/CLI 可能有不同路径",
      ]
    blockingCases: [MSR-REASON-007, MSR-SURFACE-009]

  - id: DEC-011
    domain: selection
    status: resolved-needs-proof
    question: "Does model menu selection update Recent immediately, or only when Submission is accepted?"
    options:
      [
        "Only write Recent on accepted Submission",
        "Write Recent immediately when menu item is selected",
        "Write Recent after first real response",
      ]
    recommendation: "Only write Recent on accepted Submission; desktop, remote, and failure/cancellation path evidence required."
    evidence:
      [
        "newer-design: App Recent update point is App accepts Submission",
        "runtime: SessionPane writes recent after accepted ACK",
      ]
    blockingCases: [MSR-DRAFT-006, MSR-SESSION-009]

  - id: DEC-012
    domain: selection
    status: resolved-needs-proof
    question: "When Edit/Retry/Guide/Queue copies model selection from source Submission, is the user allowed to explicitly choose 'use current model'?"
    options:
      [
        "Inherit source Submission by default; using the current model must be an explicit new selection",
        "总是读取当前 Session",
        "Edit/Retry inherits while Queue does not",
      ]
    recommendation: "Inherit source Submission by default; current-model as explicit SelectionSource in the future."
    evidence:
      [
        "newer-design: edit/retry inherit source Submission ModelSelection",
        "state-space: queue freezes model/thought Selection",
      ]
    blockingCases: [MSR-QUEUE-003, MSR-EDIT-001]

  - id: DEC-013
    domain: registry
    status: undefined
    question: "When the three Provider tiers (Built-in, Account, Personal) define the same providerId/modelId simultaneously, what are the override order and field merge rules?"
    options: ["Entirely override by explicit precedence", "按字段 merge", "Detect conflict and hide the provider"]
    recommendation: "provider identity first converges by explicit precedence; field merge only allows fields explicitly listed in the schema."
    evidence:
      [
        "registry: provider-and-model-configuration-overview",
        "runtime: ProviderConfigResolver source overlays",
      ]
    blockingCases: [MSR-REG-004, MSR-REG-007]

  - id: DEC-014
    domain: registry
    status: undefined
    question: "When a Provider configuration has an old revision, current revision, and unknown revision simultaneously, does Registry publish atomically?"
    options:
      ["只发布完整且 revision 一致的 snapshot", "部分字段先发布", "回退旧 revision 并继续可用"]
    recommendation: "Only publish complete and consistent snapshots; retain previous available snapshot and log reason on failure."
    evidence:
      ["registry: atomic Registry publish seed case", "risk: built-in/account revision mismatch"]
    blockingCases: [MSR-REG-004, MSR-REG-008]

  - id: DEC-015
    domain: registry
    status: undefined
    question: "When provider config is missing but model membership exists, should candidates be hidden, shown as unavailable, or allowed to be saved pending config?"
    options: ["显示 unavailable 并阻止发送", "隐藏候选", "Allow saving the selection, but fail at execution"]
    recommendation: "保存 intent 可以允许，执行前必须 fail closed；展示态保留不可用原因。"
    evidence:
      [
        "registry: separate layers for membership/enablement and complete config",
        "runtime: target Host Registry authority",
      ]
    blockingCases: [MSR-REG-009, MSR-AUTH-004]

  - id: DEC-016
    domain: registry
    status: undefined
    question: "After provider endpoint/baseURL changes, should existing Active Models be hot-reloaded, or only affect subsequent ModelFactory instances?"
    options:
      [
        "Active Model immutable，只影响后续 model",
        "Hot-reload on the next chunk",
        "终止旧 model 并自动重试新 endpoint",
      ]
    recommendation: "Active Model is immutable; endpoint changes only affect future creations, in-flight requests are not rewritten."
    evidence:
      [
        "newer-design: active Model immutable; provider config changes apply to future Model creation",
      ]
    blockingCases: [MSR-REG-010, MSR-SESSION-005]

  - id: DEC-017
    domain: registry
    status: undefined
    question: "Registry loading、refresh、publish 期间，picker 应显示旧 snapshot、空状态还是 loading lock？"
    options: ["显示旧 snapshot 并标记 stale", "清空并锁定选择", "Continue showing merged candidates while loading"]
    recommendation: "Stale-read when an old snapshot is available; block Registry-dependent submissions when no snapshot exists."
    evidence:
      [
        "runtime: remote Registry loading must not fallback local",
        "state: registry revision/readiness dimension",
      ]
    blockingCases: [MSR-REG-003, MSR-REG-011]

  - id: DEC-018
    domain: registry
    status: undefined
    question: "Is cache sharing allowed between remote workspace and local workspace provider registries?"
    options: ["按 workspaceKey 严格隔离", "Same providerId can share read-only facts", "按 workspacePath 共享"]
    recommendation: "按 workspaceKey 隔离；任何共享必须经过明确 immutable facts cache 设计。"
    evidence:
      [
        "AGENTS: semantic separation of workspaceIdentity and workspacePath",
        "runtime: model-selection-recent key uses workspaceKey",
      ]
    blockingCases: [MSR-REMOTE-001, MSR-REMOTE-004]

  - id: DEC-019
    domain: registry
    status: contract-conflict
    question: "旧 client-config/magic_name/fallback/tombstone 路径是否仍是当前 Registry 的语义来源？"
    options:
      [
        "Provider Registry is the sole current source; legacy paths are only for migration",
        "旧路径与 Registry 双向兼容",
        "按 surface 继续分别读取",
      ]
    recommendation: "Adopt Registry as the single current source; maintain migration compatibility but forbid new cases from relying on legacy semantics."
    evidence:
      [
        "newer-design: design-v2 authority order",
        "planning: graph drift marks legacy references stale",
      ]
    blockingCases: [MSR-REG-012, MSR-MIGRATION-001]

  - id: DEC-020
    domain: registry
    status: contract-conflict
    question: "Does the provider identity in the Provider registry include account, workspace, host, and endpoint, rather than just providerId?"
    options:
      [
        "Identity consists of providerId plus host/workspace/account scope",
        "Use only providerId",
        "Generate a new providerId when endpoint changes",
      ]
    recommendation: "Separate selection identity from config scope; authority across workspaces/hosts must carry identity."
    evidence:
      ["AGENTS: remote workspaceIdentity must be carried through", "newer-design: target Host Registry authority"]
    blockingCases: [MSR-REG-003, MSR-REMOTE-001]

  - id: DEC-021
    domain: registry
    status: contract-conflict
    question: "Registry publish 失败时，消费者是否可以看到混合的新旧 provider/model snapshot？"
    options:
      [
        "Disallow partial publish; continue using the previous snapshot",
        "Allow updates per provider",
        "允许 renderer 先看到 optimistic snapshot",
      ]
    recommendation: "Disallow partial publish; renderer optimistic only represents intent and must not masquerade as Registry authority."
    evidence:
      [
        "registry: atomic Registry publish design/case",
        "AGENTS: UI cannot call Repo and Host is authority",
      ]
    blockingCases: [MSR-REG-004, MSR-REG-013]

  - id: DEC-022
    domain: registry
    status: resolved-needs-proof
    question: "Do provider config and credential updates only affect subsequent ModelFactory instances without modifying persisted historical provenance?"
    options:
      [
        "Historical provenance is immutable; future models read the latest config",
        "历史按 provider config 回溯重算",
        "Rerun current task upon update",
      ]
    recommendation: "Historical provenance is immutable; supplement request/usage evidence for the same Session before and after config updates."
    evidence:
      ["newer-design: active Model immutable", "planning: provenance is a separate assertion layer"]
    blockingCases: [MSR-REG-010, MSR-RECOVERY-004]

  - id: DEC-023
    domain: registry
    status: resolved-needs-proof
    question: "When provider/model display label, opaque modelId, and wire model name differ, which one enters provenance?"
    options:
      ["保存结构化 providerId/modelId 与最终 wire name", "只保存 display label", "只保存 wire name"]
    recommendation: "至少保存结构化 identity 和 wire projection；展示 label 只能是派生值。"
    evidence:
      [
        "runtime: model selection type and adapter request projection",
        "risk: opaque IDs contain reserved display characters",
      ]
    blockingCases: [MSR-REG-002, MSR-REQ-004]

  - id: DEC-024
    domain: entitlement
    status: undefined
    question: "When a provider is connected but plan entitlement is still loading, can saved selections still be displayed and queued?"
    options:
      [
        "Preserve intent, block execution until entitlement is ready",
        "Fall back to preferred immediately",
        "Allow request and let the server reject it",
      ]
    recommendation: "Preserve intent, fail closed before execution; do not disrupt user selection due to temporary loading."
    evidence:
      [
        "factor: entitlement loading is separate from provider auth",
        "seed: MSR-AUTH-002 preserves saved selection",
      ]
    blockingCases: [MSR-AUTH-002, MSR-QUEUE-004]

  - id: DEC-025
    domain: entitlement
    status: undefined
    question: "When entitlement changes from allowed to denied, how should existing Sessions, queued Submissions, and Automation records be handled?"
    options:
      ["Preserve history; block future executions with a prompt", "全部迁移到可用 preferred", "Clean up all unavailable selections"]
    recommendation: "Preserve intent in history and records, fail closed for future executions by scope; automatic migration requires an explicit product contract."
    evidence:
      [
        "planning: Session/Automation/Off-Peak records are separate authorities",
        "risk: saved explicit models must not silently change",
      ]
    blockingCases: [MSR-AUTH-005, MSR-QUEUE-005, MSR-SURFACE-002]

  - id: DEC-026
    domain: entitlement
    status: undefined
    question: "When a model appears selectable but the operation (e.g., tools, image, long context) exceeds entitlement, does validation occur in the picker or request preflight?"
    options:
      [
        "Picker performs static capability filtering, preflight performs final validation",
        "只在 picker 过滤",
        "只在 network response 后处理",
      ]
    recommendation: "Two-layer validation with static filtering plus pre-execution preflight; server rejection must not be treated as normal pruning."
    evidence:
      [
        "planning: adapter preflight + request body",
        "factor: entitlement and model capability are independent dimensions",
      ]
    blockingCases: [MSR-AUTH-006, MSR-REQ-001]

  - id: DEC-027
    domain: entitlement
    status: undefined
    question: "During account switching, OAuth refresh, or coding-plan changes, should the current Active Model continue completing in-flight requests?"
    options:
      ["in-flight 使用已绑定 auth，后续请求使用新 auth", "立即中止并重试", "共享最新 auth token"]
    recommendation: "Auth context bound to the request is not rewritten mid-flight; subsequent ModelFactory uses the latest credentials."
    evidence:
      [
        "planning: request auth is execution-local and dynamic",
        "AGENTS: fail before network for auth failure",
      ]
    blockingCases: [MSR-AUTH-007, MSR-SESSION-010]

  - id: DEC-028
    domain: entitlement
    status: undefined
    question: "同一 provider 的个人 key、OAuth、团队代理同时可用时，选择是按 auth priority 还是按 provider config priority？"
    options:
      ["Auth sources have explicit priority and record provenance", "Last-written credentials take priority", "Try one by one after request failure"]
    recommendation: "Forbid unbounded retries; choose a single auth context and keep it observable before failure."
    evidence:
      [
        "planning: provider/account/personal config are separate layers",
        "risk: retry can duplicate side effects",
      ]
    blockingCases: [MSR-AUTH-008, MSR-REQ-006]

  - id: DEC-029
    domain: entitlement
    status: undefined
    question: "When organization policy bans a model but the user has historical records, is the history page readable, retryable, editable, or completely locked?"
    options: ["History is readable; retries and new submissions are blocked by policy", "Hide history as well", "历史自动迁移到允许模型"]
    recommendation: "Separate read and write; forbid silently altering historical provenance."
    evidence:
      [
        "planning: provenance/history is immutable",
        "factor: policy, access, operation and recovery are separate",
      ]
    blockingCases: [MSR-AUTH-009, MSR-EDIT-002]

  - id: DEC-030
    domain: entitlement
    status: contract-conflict
    question: "When a model is unavailable, is the existing behavior of \'fallback to an available model and promote to last-selected\' still the current contract?"
    options:
      [
        "Preserve explicit intent, forbid silent fallback",
        "保留旧 fallback 并更新 Recent",
        "Fall back only for new chats; existing Sessions do not fall back",
      ]
    recommendation: "Follow the newer selection-state: no silent fallback; legacy I56/I58/I61 must be marked legacy or rewritten."
    evidence:
      [
        "newer-design: existing Session unavailable selection preserves intent",
        "case-catalog: I56/I58/I61 define fallback behavior",
      ]
    blockingCases: [MSR-SESSION-007, MSR-REG-005]

  - id: DEC-031
    domain: entitlement
    status: resolved-needs-proof
    question: "entitlement 在 execution 前变更时，失败是否保证不写 Recent、Session Selection、usage 和 provenance？"
    options:
      [
        "Fail closed before admission/commit; none of the four side effects are written",
        "先写 selection 再异步失败",
        "fallback 后写新 provenance",
      ]
    recommendation: "Produce no accepted Submission side effects before failure; provide failure ledger evidence."
    evidence:
      [
        "newer-design: Recent and Session Selection update on accepted Submission",
        "planning: auth fail before network",
      ]
    blockingCases: [MSR-AUTH-005, MSR-SESSION-009]

  - id: DEC-032
    domain: entitlement
    status: resolved-needs-proof
    question: "Can candidate signatures still be reused for the same model capability under different account entitlements?"
    options:
      [
        "capability signature 可复用，entitlement 另作 access dimension",
        "整个候选对象按账号隔离",
        "Reuse only by display label",
      ]
    recommendation: "Model capability and access separately; tests must prove pruning does not leak selectable state across accounts."
    evidence:
      [
        "catalog: model expansion by capability-and-wire signature",
        "factor: provider access profile is independent dimension",
      ]
    blockingCases: [MSR-AUTH-006, MSR-REMOTE-005]

  - id: DEC-033
    domain: reasoning
    status: undefined
    question: "Must the four states of thought options—missing, null, default, and explicit-off—be distinguished?"
    options:
      [
        "Distinguish missing/default/explicit-off/explicit-value",
        "null 与 missing 等价",
        "Retain only the final wire value",
