    blockingCases: [MSR-REASON-001, MSR-REASON-008]

  - id: DEC-034
    domain: reasoning
    status: undefined
    question: "When both reasoning effort and thinking budget are set by the user, which is authoritative?"
    options:
      [
        "provider-specific mapping 产生一个 canonical budget",
        "budget 覆盖 effort",
        "effort 覆盖 budget",
