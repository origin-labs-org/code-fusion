  - id: DEC-038
    domain: reasoning
    status: undefined
    question: "When reasoning max budget conflicts with model max output/context budget, should it truncate, reject, or auto-compress?"
    options: ["Reject during preflight and explain budget relationships", "Automatically clamp to available upper bound", "Send request first and let provider truncate"]
