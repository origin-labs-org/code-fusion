<!doctype html>
<!-- Google's consent page, as consent.google.com shows it before any
     results in the EU, trimmed by hand. -->
<html lang="en">
<head><title>Before you continue to Google</title></head>
<body>
<div role="dialog" aria-modal="true">
  <h1>Before you continue to Google</h1>
  <div>We use cookies and data to deliver and maintain Google services, track outages and protect against spam, fraud and abuse.</div>
  <form action="https://consent.google.com/save" method="post">
    <button aria-label="Reject all">Reject all</button>
    <button aria-label="Accept all">Accept all</button>
  </form>
  <a href="https://consent.google.com/dl?continue=https://www.google.com/search">More options</a>
</div>
</body>
</html>
