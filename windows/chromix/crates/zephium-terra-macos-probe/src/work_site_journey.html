<style>label,input,button{font:20px system-ui;margin:8px}input{width:130px}section{margin:12px 0}</style>
<h1>Rail journeys</h1>
<form role="search" action="/journey-results" method="get">
<section aria-label="Stations">
<label>From <input id="from" name="from" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="origins" autocomplete="off"></label>
<div id="origins" hidden><div role="listbox" aria-label="Departure choices"><button type="button" role="option" aria-label="Northport." aria-selected="false">Northport</button></div></div>
<label>To <input id="to" name="to" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="destinations" autocomplete="off"></label>
<div id="destinations" hidden><div role="listbox" aria-label="Arrival choices"><button type="button" role="option" aria-label="Lakeside." aria-selected="false">Lakeside</button></div></div>
</section>
<section aria-label="Departure date">
<label>Day <input type="text" role="spinbutton" name="day" value="12"></label>
<label>Month <input type="text" role="spinbutton" name="month" value="10"></label>
<label>Year <input type="text" role="spinbutton" name="year" value="2026"></label>
</section>
<section aria-label="Departure time">
<label>Hours <input type="text" role="spinbutton" name="hour" value="13"></label>
<label>Minutes <input type="text" role="spinbutton" name="minute" value="00"></label>
</section>
<button type="submit">Search</button>
</form>
<script>
document.querySelector('input[name="hour"]').addEventListener('input',event=>{
  fetch('/journey-hour-edited?matched='+Number(Number(event.target.value)===9)).catch(()=>{});
});
for (const [fieldId,listId] of [['from','origins'],['to','destinations']]) {
  const field=document.getElementById(fieldId),list=document.getElementById(listId),option=list.querySelector('button');
  field.addEventListener('input',()=>{list.hidden=false;field.setAttribute('aria-expanded','true');field.dataset.chosen='';option.setAttribute('aria-selected','false');});
  option.addEventListener('click',()=>{field.value=option.textContent;field.dataset.chosen='yes';fetch('/journey-station-chosen?field='+fieldId+'&matched=1').catch(()=>{});option.setAttribute('aria-selected','true');field.setAttribute('aria-expanded','false');list.hidden=true;});
}
document.querySelector('form').addEventListener('submit',event=>{
  if (![document.getElementById('from'),document.getElementById('to')].every(field=>field.dataset.chosen==='yes')) {
    event.preventDefault(); const note=document.createElement('p');note.setAttribute('role','alert');note.textContent='Choose both station suggestions before searching.';event.target.append(note);
  }
});
</script>
